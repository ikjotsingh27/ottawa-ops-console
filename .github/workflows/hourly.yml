name: Hourly live data and deploy

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (off the busy top of the hour)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/live.json", "site/history.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test parsers
        run: node --test test/parsers.test.mjs

      - name: Fetch live sources
        run: node scripts/fetch-live.mjs

      - name: Save live data to the repo
        run: |
          git config user.name "ops-console-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/live.json site/history.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
