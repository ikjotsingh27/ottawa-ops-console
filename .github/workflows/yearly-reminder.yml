name: Yearly figures reminder

on:
  schedule:
    - cron: "0 14 1 4 *"   # 1 April each year
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          YEAR=$(date -u +%Y)
          cat > body.md <<'BODY'
          The live feeds update on their own, but the published annual figures in site/data.json are typed in by hand. Check for new releases and update the numbers, sources and coverage notes:

          - Ottawa Police Service annual report
          - Ottawa Fire Services annual report
          - Ottawa Paramedic Service annual report
          - 9-1-1 annual report
          - By-law and Regulatory Services annual report
          - Statistics Canada Crime Severity Index (usually July)
          - Hospital offload delay figures

          Close this issue when done.
          BODY
          gh issue create --title "Refresh the annual figures for $YEAR" --body-file body.md
