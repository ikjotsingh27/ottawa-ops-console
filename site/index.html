<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified Operations Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231d4ed8%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-family=%22Arial%22 font-size=%2211%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EOPS%3C/text%3E%3C/svg%3E">
<meta name="description" content="Unified Operations Console: Ottawa public safety data and a SOC cyber defence lab, with live public feeds refreshed hourly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;500;600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a duty officer's night desk. Calm, exact, every number carries its year and source.
   IDEA: one operations board with two desks (Ottawa public safety, SOC cyber defence); each section is its own page.
   PICTURE: the working tools and true chart forms (Level Zero columns, severity bars, timelines) lead each view.
   COLOUR and TYPE: white ground, graphite ink, cobalt accent, slate support (deep slate at night); Inter Tight 300 titles, Inter body, Plex Mono only for logs.
   LAYOUT: top bar with desk switch and search, section rail (chips on narrow screens), one focused view at a time, detail in a side drawer. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1419);--s1:light-dark(#f6f7f9,#161c23);--s2:light-dark(#eef1f4,#1d252e);--s3:light-dark(#e2e6eb,#27313c);--line:light-dark(#d9dee4,#2c3640);--ink:light-dark(#111827,#e8edf2);--dim:light-dark(#4b5563,#a7b2bf);--faint:light-dark(#6b7280,#808c99);--acc:light-dark(#1d4ed8,#7aa2ff);--onacc:light-dark(#ffffff,#0b1220);--dusk:light-dark(#64748b,#7d8ea3);--crit:light-dark(#c8102e,#ff6b6b);--high:light-dark(#c2410c,#fb923c);--med:light-dark(#a16207,#facc15);--low:light-dark(#475569,#94a3b8);--good:light-dark(#047857,#34d399);--code:light-dark(#f3f5f8,#0b1015);--topbg:light-dark(rgba(255,255,255,.93),rgba(15,20,25,.93));--pbad:light-dark(#fde8eb,#3a1518);--pwarn:light-dark(#fdf3d8,#3a2e10);--pgood:light-dark(#dcf3ea,#0f2e24);--refbg:light-dark(#e8eefc,#1c2a4a);--markbg:light-dark(#fde68a,#5b4a12);--scrim:light-dark(rgba(15,23,42,.45),rgba(0,0,0,.6));--shadow:light-dark(rgba(15,23,42,.14),rgba(0,0,0,.5));--r:12px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.mono,pre,code{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
h1{font:300 clamp(30px,4.4vw,46px)/1.05 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em}
h2{font:500 22px/1.2 "Inter Tight",Inter,sans-serif}
h3{font-size:16px;font-weight:600}
p{margin:0}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.top{position:sticky;top:0;z-index:30;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1320px;margin:0 auto;padding:10px max(3vw,14px);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.mark{width:38px;height:38px;border-radius:10px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:600 13px "Inter Tight",Inter,system-ui,sans-serif}
.brand b{display:block;font:600 16px/1.1 "Inter Tight",Inter,system-ui,sans-serif}
.brand small{color:var(--dim);font-size:13px}
.desks{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.desks button{border:0;background:none;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px;color:var(--dim)}
.desks button[aria-current=true]{background:var(--ink);color:var(--bg)}
.search{position:relative;flex:1 1 220px;max-width:420px;margin-left:auto}
.search input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:0 14px 0 38px;font-size:16px}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;stroke:var(--dim)}
.results{position:absolute;top:50px;left:0;right:0;background:var(--s2);border:1px solid var(--line);border-radius:12px;max-height:70vh;overflow:auto;box-shadow:0 18px 40px var(--shadow);display:none}
.results.on{display:block}
.results h4{margin:0;padding:10px 14px 4px;font-size:12px;color:var(--faint);font-weight:600}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;min-height:44px}
.results button:hover,.results button.sel{background:var(--s3)}
.results .sub{display:block;font-size:13px;color:var(--dim)}
.clock{text-align:right;line-height:1.15}
.clock b{font:500 18px "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:12px;color:var(--dim)}
.shell{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;padding:0 max(3vw,14px)}
.rail{position:sticky;top:76px;align-self:start;padding:20px 0;max-height:calc(100vh - 80px);overflow:auto}
.rail h5{margin:16px 8px 6px;font-size:12px;color:var(--faint);font-weight:600}
.rail h5:first-child{margin-top:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:9px;padding:8px 10px;min-height:42px;font-size:14px;color:var(--ink)}
.nav button:hover{background:var(--s1)}
.nav button[aria-current=true]{background:var(--s2);border-color:var(--line)}
.nav .n{margin-left:auto;font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--faint)}
.nav .n.c{color:var(--crit)}
main{padding:24px 0 60px;min-height:70vh}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
.head p{max-width:72ch;margin-top:8px;color:var(--dim)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--dim);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;min-height:44px;font-weight:600;font-size:14px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3+p,.card h3+.dim{margin-top:6px}
.kpi .v{font:300 clamp(28px,3.4vw,40px)/1 "Inter Tight",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:15px;color:var(--dim);margin-left:4px}
.kpi .k{margin-top:8px;font-weight:600;font-size:14px}
.kpi .d{margin-top:4px;font-size:13px;color:var(--dim)}
.chg{font:500 13px "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap}
.bad{color:var(--crit)}.good{color:var(--good)}.flat,.neutral{color:var(--dim)}
.sec{margin-top:26px}
.sec>h2{margin-bottom:12px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar .t{height:14px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px;background:var(--dusk)}
.bar .num{font:500 13px "IBM Plex Mono",ui-monospace,monospace;white-space:nowrap;text-align:right}
.cols{display:flex;align-items:flex-end;gap:12px;height:240px;padding-top:24px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.cols .c i{display:block;width:min(64px,80%);border-radius:6px 6px 0 0;background:var(--dusk)}
.cols .c b{font:500 12px "IBM Plex Mono",ui-monospace,monospace;margin-bottom:6px;white-space:nowrap}
.colx{display:flex;gap:12px}.colx span{flex:1;text-align:center;font-size:13px;color:var(--dim);padding-top:6px}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.sev::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.critical{color:var(--crit)}.high{color:var(--high)}.medium{color:var(--med)}.low{color:var(--low)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:500}
.chip[aria-pressed=true]{border-color:var(--acc);color:var(--acc)}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--onacc);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;font-size:14px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:grid;gap:6px}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:52px}
.it:hover{border-color:var(--dusk)}
.it .nm{font-weight:600;font-size:14px;line-height:1.35}
.it .meta{font-size:12.5px;color:var(--dim)}
.it .st{font:500 12px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;color:var(--faint)}
.st.acknowledged{color:var(--med)}.st.resolved{color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
label.f{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:6px}
input.in,select.in,textarea.in{width:100%;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px}
textarea.in{min-height:140px;font-family:"IBM Plex Mono",monospace;font-size:14px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--faint);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--s2)}tr.pick.on td{background:var(--s3)}
.note{border-left:3px solid var(--dusk);padding:4px 0 4px 12px;color:var(--dim);font-size:14px}
.watch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:56px}
.watch .fig{font:300 26px "Inter Tight",Inter,system-ui,sans-serif;white-space:nowrap}
.pill{font-size:11.5px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.pill.signal{background:var(--pbad);color:var(--crit)}.pill.watchp{background:var(--pwarn);color:var(--med)}.pill.relief{background:var(--pgood);color:var(--good)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 14px}
.tl li::before{content:"";position:absolute;left:-20px;top:7px;width:11px;height:11px;border-radius:50%;background:currentColor;border:2px solid var(--bg)}
.tl .when{font:500 12px "IBM Plex Mono",ui-monospace,monospace;color:var(--dim)}
.tl .what{font:13px/1.5 "IBM Plex Mono",ui-monospace,monospace;color:var(--ink);word-break:break-word}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.on{display:block}
.drawer .bg{position:absolute;inset:0;background:var(--scrim)}
.drawer .pane{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:18px max(3vw,16px) 40px}
.ref{border:0;background:var(--refbg);color:var(--acc);border-radius:5px;padding:0 5px;font:500 .95em "IBM Plex Mono",ui-monospace,monospace}
.ioc{border:1px dashed var(--dusk);background:none;border-radius:6px;padding:4px 8px;font:500 12.5px "IBM Plex Mono",ui-monospace,monospace;min-height:32px}
.meter{height:10px;background:var(--s3);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--good)}
details{background:var(--s1);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px}
details>div{padding:0 14px 14px;color:var(--dim)}
details>div p+p{margin-top:10px}
.score{font:300 64px/1 "Inter Tight",Inter,system-ui,sans-serif}
mark{background:var(--markbg);color:var(--ink);border-radius:3px;padding:0 2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.ibtn{width:24px;height:24px;min-height:0;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--dim);font:600 13px/1 Georgia,serif;font-style:italic;display:inline-grid;place-items:center;vertical-align:middle;margin-left:10px;padding:0;position:relative;top:-3px}
.ibtn:hover,.ibtn[aria-expanded=true]{color:var(--acc);border-color:var(--acc)}
h2 .ibtn,h3 .ibtn{top:-1px;width:22px;height:22px;font-size:12px}
.pop{position:fixed;z-index:70;width:min(400px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:14px;padding:14px 16px 16px;box-shadow:0 18px 50px var(--shadow);display:none}
.pop.on{display:block}
.pop h4{margin:0 26px 4px 0;font:600 16px/1.3 Inter,system-ui,sans-serif}
.pop dl{margin:6px 0 0;font-size:14px;line-height:1.5}.pop dt{font-weight:600;margin-top:10px}.pop dd{margin:2px 0 0;color:var(--dim)}
.pop .x{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--dim);font-size:20px;line-height:1;width:32px;height:32px;min-height:0}
.livep{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--dim);background:var(--s1);min-height:36px;white-space:nowrap}
.livep i,.fresh i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim)}
i.ok{background:var(--good)!important}i.warn{background:var(--med)!important}i.bad{background:var(--crit)!important}
.tile{text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:132px}
.tile:hover{border-color:var(--acc)}
.tile .big{font:300 30px/1.05 "Inter Tight",Inter,system-ui,sans-serif}
.spark{width:120px;height:28px;display:block}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.notice{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--dim)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--faint)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){.shell{grid-template-columns:minmax(0,1fr);gap:0}.rail{position:sticky;top:var(--toph,118px);z-index:20;background:var(--bg);padding:8px 0;max-height:none;border-bottom:1px solid var(--line);overflow-x:auto}.rail h5{display:none}.navwrap{display:flex;gap:6px;width:max-content}.nav{flex-direction:row;gap:6px;flex:none;width:max-content}.nav button{flex:none;width:auto;white-space:nowrap;border-color:var(--line);min-height:40px}.nav .n{display:none}}
@media(max-width:640px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.clock{display:none}.search{max-width:none;flex-basis:100%}.bar{grid-template-columns:minmax(0,1fr) auto}.bar .t{grid-column:1/-1;grid-row:2}.cols{gap:6px}.cols .c b{font-size:10.5px}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--faint)}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top" id="top">
  <div class="topin">
    <button class="brand" data-go="home" aria-label="Console home"><span class="mark">OPS</span><span><b>Unified Operations Console</b><small>Ottawa public safety · SOC cyber defence</small></span></button>
    <nav class="desks" aria-label="Desks">
      <button data-go="home" data-desk="home">Home</button>
      <button data-go="ps-live" data-desk="ps">Public safety</button>
      <button data-go="soc-overview" data-desk="soc">Cyber defence</button>
    </nav>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search both desks (press /)" aria-label="Search both desks" aria-controls="results">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="livep" id="livep" data-go="ps-live" title="Live data status"><i></i><span>Live data</span></button>
    <div class="clock" aria-live="off"><b id="clk">--:--:--</b><small id="clkd">Toronto (ET)</small></div>
  </div>
</header>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Sections"></aside>
  <main id="main"><p class="dim">Loading the console…</p></main>
</div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="bg" data-act="close"></div><div class="pane" id="pane"></div></div>
<div class="pop" id="pop" role="dialog" aria-modal="false" aria-labelledby="poph"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.DATA=/*__DATA__*/null;</script>
<script>
{
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt=n=>Number(n).toLocaleString("en-CA");
const ratio=(cy,py)=>py?(cy-py)/py:0;
const pctTxt=r=>{const v=Math.round(r*1000)/10;return (v>0?"+":"")+(Number.isInteger(v)?v:v.toFixed(1))+"%"};
const SEVS=["critical","high","medium","low"];const SW={critical:4,high:3,medium:2,low:1};

  const wd=L("weather")?.data,bd=L("border")?.data,td=L("traffic")?.data,cd=L("cyber")?.data,kd=L("kev")?.data;
  const local=(bd?.crossings||[]).filter(c=>c.local&&typeof c.travellers==="number");const mx=local.sort((a,b)=>b.travellers-a.travellers)[0];
  const tile=(go,label,big,sub,id)=>`<button class="tile" data-go="${go}"><span class="row" style="justify-content:space-between;width:100%"><b style="font-size:14px">${label}</b>${freshTag(id).replace(/ · <a[^>]*>source<\/a>/,"")}</span><span class="big">${big}</span><span class="dim" style="font-size:13.5px">${sub}</span></button>`;
  return`<section style="margin-bottom:22px"><div class="row" style="justify-content:space-between"><h2>Situation now${infoBtn("situation")}</h2><button class="btn ghost" data-act="copy-hourly">Copy hourly sitrep</button></div>
  <div class="grid g4" style="margin-top:12px">
   ${tile("ps-live","Weather",wd?(wd.alerts.length?`<span class="critical">${wd.alerts.length} alert${wd.alerts.length>1?"s":""}</span>`:esc(wd.current?.temperature||"No alerts")):"n/a",wd?esc(wd.alerts[0]?.title||wd.current?.title||""):"Waiting for first run","weather")}
   ${tile("ps-live","Border near Ottawa",mx?waitTxt(mx.travellers):"n/a",mx?"Longest local wait: "+esc(mx.name):"No local data","border")}
   ${tile("ps-live","Road incidents",td?td.counts.incidents:"n/a",td?`${td.counts.highPriority} high priority · ${td.counts.construction} construction`:"No data","traffic")}
   ${tile("soc-feed","Cyber threats",kd?`${kd.added7} <small class="dim" style="font-size:14px">new KEV this week</small>`:"n/a",cd?.items?.[0]?esc(cd.items[0].title.slice(0,70)):"No advisories","kev")}
  </div></section>`;
}
function hourlySitrep(){
  const t=new Date().toLocaleString("en-CA",{timeZone:"America/Toronto",dateStyle:"medium",timeStyle:"short",hourCycle:"h23"});
  const wd=L("weather")?.data,bd=L("border")?.data,td=L("traffic")?.data,kd=L("kev")?.data,cd=L("cyber")?.data;
  const L2=[`Ottawa situation report, ${t} ET. Live feeds last checked ${ago(LIVE?.generatedAt)}.`];
  if(wd)L2.push(`Weather: ${wd.alerts.length?wd.alerts.map(a=>a.title).join("; "):"no watches or warnings"}. ${wd.current?`Now ${wd.current.title}.`:""}`);
  if(bd)L2.push(`Border near Ottawa: ${bd.crossings.filter(c=>c.local).map(c=>`${c.name} ${waitTxt(c.travellers)}`).join("; ")||"no data"}.`);
  if(td)L2.push(`City roads: ${td.counts.incidents} active incidents, ${td.counts.highPriority} high priority, ${td.counts.construction} construction events.`);
  if(kd)L2.push(`Cyber: ${kd.added7} vulnerabilities added to CISA's exploited list this week.${cd?.items?.[0]?" Latest Cyber Centre item: "+cd.items[0].title+".":""}`);
  const y=O().Y2025;L2.push(`Context: Level Zero ${fmt(y.para.levelZero)} minutes in 2025; life threatening response ${y.para.ctas1}% within 8 minutes (target 75%). Fire incidents ${fmt(y.fire.incidents)} in 2025. Ottawa crime severity index ${y.statcan.ottawaCsi} (2025).`);
  return L2.join("\n");
}

window.addEventListener("resize",()=>closeInfo());window.addEventListener("scroll",()=>{if(S.infoBtn)placeInfo()},{passive:true});
function rerenderLight(){renderRail();const v=S.view;const tab=S.tab[v]||"findings";if(v==="home"||v==="soc-overview"||v==="soc-queue"||(/^soc-m/.test(v)&&tab!=="tool")||(/^soc-m(8|9|10|12)$/.test(v))){const y=window.scrollY;render();window.scrollTo({top:y})}}

/* ============ BOOT ============ */
function init(data){D=data;D.soc.forEach(m=>{MOD[m.num]=m;m.items.forEach((i,ix)=>{i.k=m.num+":"+ix;i.num=m.num;ITEMS.push(i);BYCODE[i.code]=i})});
 CODE_RE=new RegExp(`\\b(?:${[...new Set(ITEMS.map(i=>i.code.split("-")[0]))].join("|")})-\\d{2}\\b`,"g");
 LABTEXT=" "+ITEMS.map(i=>(i.title+" "+i.logic+" "+i.ev+" "+i.src).toLowerCase().replace(/[^a-z0-9]+/g," ")).join(" ")+" ";
 tick();setInterval(tick,1000);const v=location.hash.slice(1);S.view=validView(v)?v:"home";render()}
(async()=>{let data=window.DATA;if(!data){try{const r=await fetch("data.json",{cache:"no-cache"});data=await r.json()}catch(err){$("#main").innerHTML=`<div class="card"><h2>The data file did not load</h2><p class="dim" style="margin-top:6px">Keep data.json next to this page, or use the standalone version with the data built in.</p></div>`;return}}await loadLive();init(data);setInterval(async()=>{await loadLive();const v=S.view;if(!S.drawer&&!$("#pop").classList.contains("on")&&(v==="home"||v==="ps-live"||v==="soc-feed"||(v==="ps-police"&&S.tab[v]==="ytd")||(v==="ps-sources"&&S.tab[v]==="live"))){const y=scrollY;render();scrollTo({top:y})}},600000)})();
}
